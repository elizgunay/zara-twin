<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zara Copilot: разрешение за микрофона</title>
  <style>
    :root { color-scheme: light dark; --bg: #f8f9fa; --card: #ffffff; --text: #202124; --muted: #5f6368; --accent: #1a73e8; --ok: #188038; --err: #c5221f; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #202124; --card: #2d2f33; --text: #e8eaed; --muted: #9aa0a6; --accent: #8ab4f8; --ok: #81c995; --err: #f28b82; }
    }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
      font: 15px/1.5 "Segoe UI", Roboto, Arial, sans-serif; padding: 16px; box-sizing: border-box; }
    main { max-width: 480px; background: var(--card); border-radius: 16px; padding: 28px; box-shadow: 0 2px 12px rgba(0,0,0,.15); }
    h1 { margin: 0 0 12px; font-size: 20px; }
    p { margin: 0 0 12px; color: var(--muted); }
    button { font: inherit; font-weight: 600; padding: 10px 18px; border: 0; border-radius: 999px; background: var(--accent); color: var(--card); cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    #status { margin-top: 16px; min-height: 1.5em; font-weight: 600; }
    #status.ok { color: var(--ok); }
    #status.err { color: var(--err); }
  </style>
</head>
<body>
  <main>
    <h1>Разрешение за микрофона</h1>
    <p>Zara Copilot слуша микрофона ви само докато е включен в среща, за да различава вашите думи от тези на събеседника.</p>
    <p>Разрешението се дава еднократно. Звукът се обработва само в ЕС.</p>
    <button id="grant" type="button">Разреши микрофона</button>
    <div id="status" role="status"></div>
  </main>
  <script src="permission.js"></script>
</body>
</html>
